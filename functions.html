<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funktionen – JavaScript</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="shortcut icon" href="assets/img/javascript-logo-svgrepo-com.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="js-logo">JS</div>.fabianternis.de
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="functions.html" class="active">Funktionen</a>
            <a href="index.html#tutorials">Tutorials</a>
            <a href="index.html#typescript">TypeScript</a>
            <a href="index.html#anderes">Anderes</a>
            <a href="playground.html">Playground</a>
            <button id="settings-toggle" title="Einstellungen">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            </button>
        </div>
    </nav>
    <main id="app">
        <div class="page-view">
            <section id="functions-extended">
                <h2>Alle Funktionen</h2>
                <p class="section-intro">Hier ist die komplette Liste an wichtigen JavaScript Funktionen.</p>
                <table>
                    <thead>
                        <tr>
                            <th>Funktion / Methode</th>
                            <th>Beschreibung</th>
                            <th>Demo</th>
                        </tr>
                    </thead>
                    <tbody id="functions-tbody"></tbody>
                </table>
            </section>
        </div>

        <div id="settings_popover" class="hidden">
            <h3>⚙️ Einstellungen</h3>
            <form id="settings_form">
                <div class="setting-group">
                    <label for="text-font">Text-Schriftart:</label>
                    <select id="text-font">
                        <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Segoe UI</option>
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="'Times New Roman', Times, serif">Times New Roman</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="code-font">Code-Schriftart:</label>
                    <select id="code-font">
                        <option value="monospace">Standard Monospace</option>
                        <option value="'Courier New', Courier, monospace">Courier New</option>
                        <option value="Consolas, monospace">Consolas</option>
                        <option value="'Fira Code', monospace">Fira Code</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="font-size">Schriftgröße: <span id="font-size-val">16px</span></label>
                    <input type="range" id="font-size" min="12" max="24" value="16">
                </div>
                <div class="setting-group">
                    <label for="accent-color">Akzentfarbe:</label>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="color" id="accent-color" value="#f7df1e" style="width:40px;height:32px;padding:2px;cursor:pointer;">
                        <button type="button" id="reset-accent" style="flex:1;font-size:0.8rem;padding:6px 8px;">Zurücksetzen</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label for="bg-color">Hintergrundfarbe:</label>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="color" id="bg-color" value="#1e1e1e" style="width:40px;height:32px;padding:2px;cursor:pointer;">
                        <button type="button" id="reset-bg" style="flex:1;font-size:0.8rem;padding:6px 8px;">Zurücksetzen</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="reduce-motion" style="margin-right:6px;">
                        Animationen reduzieren
                    </label>
                </div>
                <div style="display:flex;gap:8px;margin-top:15px;">
                    <button type="button" id="reset-all-settings" style="flex:1;font-size:0.85rem;">Alles zurücksetzen</button>
                    <button type="button" id="close-settings" class="cta-primary" style="flex:1;">Schließen</button>
                </div>
            </form>
        </div>

        <div id="open-link-popover" class="hidden">
            <h3>🔗 Link öffnen</h3>
            <p id="open-link-url" style="word-break:break-all;color:#aaa;font-size:0.85rem;margin:0 0 15px;"></p>
            <div class="setting-group">
                <label for="open-link-count">Wie oft öffnen?</label>
                <input type="number" id="open-link-count" min="1" max="20" value="1" style="background:#1e1e1e;color:white;border:1px solid #555;padding:8px;border-radius:4px;font-family:inherit;">
            </div>
            <div class="setting-group">
                <label>
                    <input type="checkbox" id="open-link-newtab" checked style="margin-right:6px;">
                    In neuem Tab öffnen
                </label>
            </div>
            <div style="display:flex;gap:8px;margin-top:15px;">
                <button type="button" id="open-link-cancel" style="flex:1;">Abbrechen</button>
                <button type="button" id="open-link-confirm" class="cta-primary" style="flex:1;">Öffnen</button>
            </div>
        </div>
    </main>

    <script src="assets/scripts.js"></script>
</body>
</html>
